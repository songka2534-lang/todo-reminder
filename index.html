<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" id="metaTheme" content="#2b7de0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To-do">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>รายการที่ต้องทำ</title>
<style>
:root{--hd:#2b7de0;--acc:#2b7de0;--accd:#1d62b8;--accl:#e8f1fd;--accb:#93c0f5;--soft:#f3f7fd;--box:#f6faff;--bg:#ffffff;--bgimg:none;--card:#ffffff;--txt:#1f2937;--mute:#64748b;--dim:#9ca3af;--line:#e5e7eb;--line2:#cbd5e1;--green:#16a34a;--on:#1f2937;--onsub:#2b7de0;--onmute:#64748b;--scene:84px;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Segoe UI","Leelawadee UI",Tahoma,system-ui,-apple-system,"Noto Sans Thai",sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100%;min-width:300px;position:relative}
header{background:var(--hd);color:#ffffff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;flex:none;position:relative;z-index:5}
header .t{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;min-width:0}
header .t span{overflow:hidden;text-overflow:ellipsis}
header .r{display:flex;align-items:center;gap:6px;flex:none}
header button{background:transparent;color:#ffffff;border:1px solid rgba(255,255,255,.85);border-radius:6px;padding:2px 9px;font:inherit;font-size:12px;line-height:1.5}
header button:hover{background:rgba(255,255,255,.18)}
.lang{display:flex}
.lang button{padding:1px 7px;font-size:11px}
.lang button:first-child{border-radius:6px 0 0 6px}
.lang button:last-child{border-radius:0 6px 6px 0;border-left:0}
.lang button.on{background:#ffffff;color:var(--hd)}
#themeBtn,#gearBtn{padding:2px 6px;display:flex;align-items:center;line-height:0}
#gearBtn{display:none}
#sheetBg{display:none}
#themePanel{position:absolute;right:10px;top:42px;z-index:20;width:336px;max-width:calc(100% - 20px);max-height:calc(100% - 56px);overflow:auto;background:var(--card);color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:none}
#themePanel.open{display:block}
#themePanel .tt{font-size:12px;color:var(--mute);margin:0 0 8px;font-weight:600}
.grab,.mOnly{display:none}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tchip{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:4px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--txt);font-size:11px;line-height:1.25;text-align:center}
.tchip svg{display:block;width:100%;height:auto;border-radius:5px}
.tchip:hover{border-color:var(--accb)}
.tchip.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);font-weight:600}
.srow{align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:13px;font-weight:600}
.seg2{display:flex}
.seg2 button{padding:6px 14px;font-size:13px;background:var(--card);color:var(--accd);border:1px solid var(--accb)}
.seg2 button:first-child{border-radius:8px 0 0 8px}
.seg2 button:last-child{border-radius:0 8px 8px 0;border-left:0}
.seg2 button.on{background:var(--acc);border-color:var(--acc);color:#ffffff;font-weight:600}
.mBtns{margin:12px 0 0}
.mBtns .btn{flex:1;justify-content:center;height:42px;font-size:14px}
.stage{flex:1;position:relative;min-height:0;background-color:var(--bg);background-image:var(--bgimg)}
.bgl{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgl svg{position:absolute;display:block}
.bgl .pat,.bgl .top{left:0;top:0;width:100%;height:100%}
.bgl .gnd{left:0;bottom:0;width:100%;height:var(--scene)}
.bgl .lft{left:0;bottom:0;height:var(--scene);width:calc(var(--scene) * 1.4545)}
.bgl .rgt{right:0;bottom:0;height:var(--scene);width:calc(var(--scene) * 1.4545)}
main{position:absolute;inset:0;overflow:auto;padding:12px 14px;z-index:1;-webkit-overflow-scrolling:touch}
body.scene main{bottom:var(--scene)}
.btn{background:var(--card);color:var(--txt);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--soft);border-color:var(--accb)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#ffffff}
.btn.pri:hover{background:var(--acc);filter:brightness(.9)}
.btn.sq{padding:0;width:34px;height:34px;justify-content:center;flex:none}
.dates{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative}
.dates .mid{background:transparent;border:0;text-align:center;padding:2px 8px;border-radius:6px}
.dates .mid:hover{background:rgba(127,127,127,.14)}
#dateMain{font-size:16px;font-weight:600;color:var(--on);display:block}
#dateSub{font-size:11px;color:var(--onsub);display:block}
#picker{position:absolute;left:50%;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.card{border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin-bottom:12px;background:var(--card)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
#left{font-size:12px;color:var(--mute)}
#pct{font-size:24px;font-weight:600;color:var(--green)}
.track{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
#bar{height:100%;width:0;background:var(--green);transition:width .25s}
.addbox{border:1px solid var(--accb);border-radius:8px;padding:8px;margin-bottom:12px;background:var(--box)}
#composer{display:none}
.seg{display:flex;flex:none}
.seg button{height:28px;padding:0 9px;font-size:12px;background:var(--card);color:var(--accd);border:1px solid var(--accb)}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#ffffff;font-weight:600}
#parentRow{display:none;align-items:center;gap:6px;margin-bottom:6px;font-size:13px;color:var(--mute)}
#parentRow select{flex:1;min-width:0;height:34px;border:1px solid var(--line2);border-radius:6px;background:var(--card);color:var(--txt);font:inherit;padding:0 8px}
.subbtn{font-size:12px;color:var(--accd);border:1px solid var(--accb);border-radius:5px;padding:1px 7px;background:var(--card);white-space:nowrap}
.subbtn:hover{background:var(--soft)}
.add{display:flex;gap:6px;align-items:center}
.add input{flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:var(--card);color:var(--txt);font:inherit}
input::placeholder{color:var(--dim)}
input:focus,select:focus{outline:2px solid var(--accb);outline-offset:0}
.row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.sub{padding-left:20px}
.chk{background:none;border:0;padding:0;color:var(--mute);display:flex;line-height:0;flex:none}
.chk.on{color:var(--acc)}
.chk:hover{color:var(--acc)}
.txt{flex:1;word-break:break-word;color:var(--txt);cursor:text;min-width:0}
.txt.done{text-decoration:line-through;color:var(--dim)}
.ic{background:none;border:0;padding:2px;color:var(--dim);display:flex;line-height:0;border-radius:4px;flex:none}
.ic:hover{color:#dc2626;background:rgba(220,38,38,.1)}
.acts{display:contents}
.ic.more{display:none}
.grp{border:1px solid var(--accb);border-radius:8px;background:var(--card);margin-bottom:8px;overflow:hidden}
.gh{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 6px;background:var(--accl);color:var(--accd)}
.gh .gname{flex:1;font-weight:600;word-break:break-word;cursor:text;min-width:0}
.gh .txt{font-weight:600;color:var(--accd)}
.gh .txt.done{font-weight:400;color:var(--dim)}
.gh .cnt{font-size:12px;color:var(--green);font-weight:600;flex:none}
.gh .ic{color:var(--accd);opacity:.55}
.gh .ic:hover{opacity:1}
.chev{background:none;border:0;padding:0;color:var(--accd);display:flex;line-height:0;flex:none}
.edit{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--accb);border-radius:5px;background:var(--card);color:var(--txt);font:inherit}
.empty{text-align:center;color:var(--onmute);font-size:13px;padding:22px 8px}
.row,.grp{position:relative}
.grip{display:flex;line-height:0;color:var(--dim);cursor:grab;padding:2px 0;flex:none;opacity:.8;touch-action:none}
.grip:hover{color:var(--acc);opacity:1}
.gh .grip{color:var(--accd);opacity:.45}
.dragging{opacity:.45}
.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;box-shadow:0 10px 26px rgba(0,0,0,.28);background:var(--card);border-radius:8px;overflow:hidden}
.drop-before::after,.drop-after::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--acc);z-index:3;pointer-events:none}
.drop-before::after{top:0}
.drop-after::after{bottom:0}
.drop-into{outline:2px solid var(--acc);outline-offset:-2px}
.ic.ed:hover{color:var(--acc);background:var(--soft)}
.ic.ok,.gh .ic.ok{color:var(--green);opacity:1}
.ic.ok:hover{color:var(--green);background:rgba(22,163,74,.12)}
footer{flex:none;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 14px;border-top:1px solid var(--line);background:var(--card);position:relative;z-index:2}
footer .btn{font-size:12px;padding:4px 9px}
#warn{font-size:11px;color:#dc2626}

@media (max-width:560px) and (pointer:coarse){
  :root{--scene:64px}
  header{padding:calc(9px + env(safe-area-inset-top)) 12px 9px;font-size:15px}
  header .lang,#themeBtn{display:none}
  #gearBtn{display:flex;width:34px;height:30px;justify-content:center;padding:0}
  header button{font-size:13px;padding:3px 11px}
  #sheetBg.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19}
  #themePanel{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;max-height:84vh;border-radius:18px 18px 0 0;border:0;padding:8px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.25)}
  .grab{display:block;width:42px;height:5px;border-radius:3px;background:var(--line2);margin:2px auto 12px}
  .mOnly{display:flex}
  #themePanel .tt{font-size:13px;color:var(--txt)}
  .tchip{font-size:11px}
  main{padding:10px 12px 14px}
  .btn.sq{width:40px;height:40px;border-radius:9px}
  #picker{left:50%;top:0;bottom:auto;transform:translateX(-50%);width:62%;height:100%;pointer-events:auto}
  .card{border-radius:10px}
  #composer{display:block;flex:none;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(10px + env(safe-area-inset-bottom));position:relative;z-index:3}
  #composer .addbox{border:0;padding:0;margin:0;background:transparent}
  #composer .add input{height:42px;border-radius:10px;font-size:16px}
  #composer #addBtn{width:42px;height:42px;border-radius:10px}
  #composer .seg button{height:34px;font-size:13px}
  #composer #parentRow select{height:38px;font-size:15px}
  .row{padding:10px 10px;gap:10px;min-height:46px}
  .row.sub{padding-left:12px}
  .gh{padding:10px 10px 10px 6px;min-height:46px}
  .chk svg{width:24px;height:24px}
  .grip{padding:6px 2px}
  .txt,.gh .gname{font-size:15px}
  .acts{display:none}
  .open>.acts{display:flex;align-items:center;gap:12px}
  .open>.acts .ic svg{width:20px;height:20px}
  .ic.more{display:flex;padding:4px}
  .ic.more svg{width:20px;height:20px}
  .row.open,.gh.open{background:var(--soft)}
  .edit{height:38px;font-size:16px}
  footer{display:none}
  footer:has(#warn:not(:empty)){display:flex}
  footer:has(#warn:not(:empty)) .btn{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="t"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span id="appTitle">รายการที่ต้องทำ</span></span>
    <span class="r">
      <span class="lang"><button type="button" id="langTh">TH</button><button type="button" id="langEn">EN</button></span>
      <button type="button" id="themeBtn"></button>
      <button id="todayBtn" type="button">วันนี้</button>
      <button type="button" id="gearBtn"></button>
    </span>
  </header>
  <div id="sheetBg"></div>
  <div id="themePanel">
    <div class="grab"></div>
    <div class="srow mOnly"><span id="langLbl"></span><span class="seg2"><button type="button" id="mLangTh">ไทย</button><button type="button" id="mLangEn">English</button></span></div>
    <div class="tt" id="themeTitle"></div>
    <div class="tgrid" id="themeGrid"></div>
    <div class="srow mOnly mBtns"><button class="btn" id="mExport" type="button"></button><button class="btn" id="mImport" type="button"></button></div>
  </div>

  <div class="stage">
    <div class="bgl" id="bgl" aria-hidden="true"></div>
    <main>
      <div class="dates">
        <button class="btn sq" id="prev" type="button"></button>
        <button class="mid" id="dateBtn" type="button">
          <span id="dateMain"></span><span id="dateSub"></span>
        </button>
        <button class="btn sq" id="next" type="button"></button>
        <input type="date" id="picker" tabindex="-1" aria-hidden="true">
      </div>

      <div class="card">
        <div class="top"><span id="left"></span><span id="pct">0%</span></div>
        <div class="track"><div id="bar"></div></div>
      </div>

      <div class="addbox" id="addbox">
        <div id="parentRow"><span id="underLbl"></span><select id="parentSel"></select></div>
        <div class="add">
          <input type="text" id="newText" autocomplete="off" enterkeyhint="done">
          <div class="seg">
            <button type="button" id="segMain" class="on"></button>
            <button type="button" id="segSub"></button>
          </div>
          <button class="btn pri sq" id="addBtn" type="button"></button>
        </div>
      </div>

      <div id="list"></div>
    </main>
  </div>

  <div id="composer"></div>

  <footer>
    <span id="warn"></span>
    <span style="display:flex;gap:6px;margin-left:auto">
      <button class="btn" id="exportBtn" type="button"></button>
      <button class="btn" id="importBtn" type="button"></button>
    </span>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </footer>
</div>

<script>
(function(){
'use strict';
var KEY='todoReminder.v1', PKEY='todoReminder.prefs';
var DAYS_TH=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
var MON_TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var DAYS_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var T={
  th:{
    title:'รายการที่ต้องทำ',today:'วันนี้',prev:'วันก่อนหน้า',next:'วันถัดไป',pick:'เลือกวันที่',
    todayDot:'วันนี้ · ',clickPick:'กดเพื่อเลือกวันที่',
    noTasks:'ยังไม่มีงานในวันนี้',allDone:'ทำครบแล้ว',left:function(n){return 'เหลืออีก '+n+' อย่าง';},
    main:'หลัก',sub:'ย่อย',mainTip:'เพิ่มเป็นหัวข้อหลัก',subTip:'เพิ่มเป็นหัวข้อย่อย',
    under:'ไว้ใต้:',noMain:'ยังไม่มีหัวข้อหลัก',pickMain:'เลือกหัวข้อหลัก',
    phMain:'เช่น ประชุมทีม',phSub:'เช่น หัวข้อ 4: งบประมาณ',needMain:'เพิ่มหัวข้อหลักก่อน แล้วค่อยเพิ่มหัวข้อย่อย',add:'เพิ่ม',
    empty:'พิมพ์หัวข้อหลักแล้วกด + เพื่อเริ่ม<br>เพิ่มหัวข้อย่อยได้ทีหลังด้วยปุ่ม "+ ย่อย"',
    addSub:'+ ย่อย',phAddSub:'พิมพ์หัวข้อย่อยแล้วกด Enter',dbl:'ดับเบิลคลิกเพื่อแก้ไข',
    edit:'แก้ไข',del:'ลบ',save:'บันทึก',cancel:'ยกเลิก',mark:'ติ๊กว่าทำแล้ว',collapse:'ย่อ/ขยาย',drag:'จับเพื่อลากเปลี่ยนตำแหน่ง',more:'ตัวเลือก',
    delGroupQ:function(n){return 'ลบกลุ่ม "'+n+'" และหัวข้อย่อยทั้งหมด?';},
    warn:'บันทึกในเบราว์เซอร์ไม่ได้ ให้กดสำรองข้อมูลเก็บไว้',backup:'สำรอง',imp:'นำเข้า',
    importQ:'นำเข้าข้อมูลจากไฟล์นี้?\nข้อมูลปัจจุบันในเครื่องจะถูกแทนที่ทั้งหมด',
    importErr:'ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอพนี้ หรือรูปแบบไม่ถูกต้อง',
    theme:'เลือกธีม',settings:'ตั้งค่า',langLbl:'ภาษา'
  },
  en:{
    title:'To-do list',today:'Today',prev:'Previous day',next:'Next day',pick:'Pick a date',
    todayDot:'Today · ',clickPick:'Click to pick a date',
    noTasks:'No tasks for this day',allDone:'All done',left:function(n){return n+' left';},
    main:'Main',sub:'Sub',mainTip:'Add as a main topic',subTip:'Add as a sub-topic',
    under:'Under:',noMain:'No main topics yet',pickMain:'Choose a main topic',
    phMain:'e.g. Team meeting',phSub:'e.g. Topic 4: Budget',needMain:'Add a main topic first',add:'Add',
    empty:'Type a main topic and press + to start<br>Add sub-topics later with "+ Sub"',
    addSub:'+ Sub',phAddSub:'Type a sub-topic and press Enter',dbl:'Double-click to edit',
    edit:'Edit',del:'Delete',save:'Save',cancel:'Cancel',mark:'Mark as done',collapse:'Collapse / expand',drag:'Drag to reorder',more:'Options',
    delGroupQ:function(n){return 'Delete "'+n+'" and all its sub-topics?';},
    warn:'Could not save in the browser. Use Backup to keep a copy.',backup:'Backup',imp:'Import',
    importQ:'Import data from this file?\nAll current data on this device will be replaced.',
    importErr:'This is not a backup file from this app, or the file is damaged.',
    theme:'Theme',settings:'Settings',langLbl:'Language'
  }
};

function A(n,o){var s='<'+n;for(var k in o)s+=' '+k+'="'+o[k]+'"';return s+'/>';}
function pine(x,b,h,c1,c2){
  var w=h*.62;
  return A('rect',{x:x-1.5,y:b,width:3,height:6,fill:'#6b4a2b'})+
    '<path d="M'+x+' '+(b-h)+' L'+(x+w/2)+' '+b+' L'+(x-w/2)+' '+b+' Z" fill="'+c1+'"/>'+
    '<path d="M'+x+' '+(b-h*.62)+' L'+(x+w*.42)+' '+(b-h*.12)+' L'+(x-w*.42)+' '+(b-h*.12)+' Z" fill="'+c2+'"/>';
}

function ungroup(g){delete g.type;delete g.children;delete g.collapsed;g.done=false;}
function normalize(o){
  Object.keys(o).forEach(function(k){
    (o[k]||[]).forEach(function(it){
      if(it.type==='group'&&!(it.children&&it.children.length))ungroup(it);
    });
  });
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o==='object'){normalize(o);return o;}}}catch(e){}

}
function save(){

function list(){return db[cur]||(db[cur]=[]);}
function cleanup(){if(db[cur]&&!db[cur].length)delete db[cur];}
function find(id){
  var arr=db[cur]||[];
  for(var i=0;i<arr.length;i++){
    if(arr[i].id===id)return {item:arr[i],arr:arr};
    if(arr[i].type==='group'){
      var ch=arr[i].children;
      for(var j=0;j<ch.length;j++)if(ch[j].id===id)return {item:ch[j],arr:ch,parent:arr[i]};
    }
  }
  return null;
}

var drag=null, drop=null, lastKey='', touchDrag=false, ghost=null, ghostOff=0, M=document.querySelector('main');
function clearMarks(){
  L.querySelectorAll('.drop-before,.drop-after,.drop-into').forEach(function(el){el.classList.remove('drop-before','drop-after','drop-into');});
}
function posAt(y,el){var r=el.getBoundingClientRect();return y<r.top+r.height/2?'before':'after';}
function dropTargetAt(t,y){
  if(!drag||!t||!t.closest||!L.contains(t)&&t!==L&&!M.contains(t))return null;
  if(drag.kind==='sub'){
    var r=t.closest('.row.sub[data-sub]');
    if(r)return r.dataset.sub===drag.id?null:{kind:'sub',id:r.dataset.sub,pos:posAt(y,r)};
    var h=t.closest('.gh');
    if(h)return {kind:'into',id:h.dataset.gh};
    var g=t.closest('.grp');
    if(g)return {kind:'intoEnd',id:g.dataset.main};
    return null;
  }
  var gp=t.closest('.grp');
  if(gp)return gp.dataset.main===drag.id?null:{kind:'main',id:gp.dataset.main,pos:posAt(y,gp)};
  var all=L.querySelectorAll('.grp');
  if(all.length&&y>all[all.length-1].getBoundingClientRect().bottom)return {kind:'end'};
  return null;
}
function mark(t){
  var el,cls;
  if(t.kind==='sub'){el=L.querySelector('.row.sub[data-sub="'+t.id+'"]');cls='drop-'+t.pos;}
  else if(t.kind==='into'){el=L.querySelector('.gh[data-gh="'+t.id+'"]');cls='drop-into';}
  else if(t.kind==='intoEnd'){el=L.querySelector('.grp[data-main="'+t.id+'"]');cls='drop-into';}
  else if(t.kind==='main'){el=L.querySelector('.grp[data-main="'+t.id+'"]');cls='drop-'+t.pos;}
  else{var all=L.querySelectorAll('.grp');el=all[all.length-1];cls='drop-after';}
  if(el)el.classList.add(cls);
}
function updateDrop(t){
  var k=t?JSON.stringify(t):'';
  if(!t){clearMarks();drop=null;lastKey='';return;}
  if(k!==lastKey){clearMarks();mark(t);lastKey=k;}
  drop=t;
}
function autoScroll(y){
  var r=M.getBoundingClientRect();
  if(y<r.top+40)M.scrollTop-=14;else if(y>r.bottom-40)M.scrollTop+=14;
}
function performDrop(d,t){
  var src=find(d.id);if(!src)return false;
  var tf,i;
  if(d.kind==='main'){
    if(src.parent)return false;
    var arr=src.arr;
    arr.splice(arr.indexOf(src.item),1);
    tf=t.kind==='end'?null:find(t.id);
    if(!tf||tf.parent){arr.push(src.item);return true;}
    i=arr.indexOf(tf.item);
    arr.splice(t.pos==='before'?i:i+1,0,src.item);
    return true;
  }
  if(!src.parent)return false;
  var item=src.item, oldParent=src.parent;
  tf=find(t.id);if(!tf)return false;
  if(t.kind==='sub'){
    if(!tf.parent)return false;
    src.arr.splice(src.arr.indexOf(item),1);
    i=tf.arr.indexOf(tf.item);
    tf.arr.splice(t.pos==='before'?i:i+1,0,item);
  }else{
    if(tf.parent)return false;
    src.arr.splice(src.arr.indexOf(item),1);
    var g=toGroup(tf.item);g.collapsed=false;
    if(t.kind==='into')g.children.unshift(item);else g.children.push(item);
  }
  if(!oldParent.children.length)ungroup(oldParent);
  return true;
}
function endDrag(){
  clearMarks();
  var x=L.querySelector('.dragging');if(x)x.classList.remove('dragging');
  if(ghost){ghost.remove();ghost=null;}
  drag=null;drop=null;lastKey='';
}
function finishDrop(){
  var d=drag,t=drop;
  endDrag();
  if(d&&t&&performDrop(d,t)){openRow=null;save();render();}
}

M.addEventListener('dragstart',function(e){
  if(touchDrag){e.preventDefault();return;}
  var g=e.target.closest&&e.target.closest('.grip');
  if(!g)return;
  drag={id:g.dataset.id,kind:g.dataset.kind};
  var box=g.closest(drag.kind==='main'?'.grp':'.row');
  try{e.dataTransfer.setData('text/plain',drag.id);e.dataTransfer.effectAllowed='move';e.dataTransfer.setDragImage(box,16,14);}catch(x){}
  setTimeout(function(){if(box)box.classList.add('dragging');},0);
});
M.addEventListener('dragover',function(e){
  if(!drag||touchDrag)return;
  autoScroll(e.clientY);
  var t=dropTargetAt(e.target,e.clientY);
  updateDrop(t);
  if(t){e.preventDefault();try{e.dataTransfer.dropEffect='move';}catch(x){}}
});
M.addEventListener('dragleave',function(e){
  if(touchDrag)return;
  if(!e.relatedTarget||!M.contains(e.relatedTarget)){clearMarks();drop=null;lastKey='';}
});
M.addEventListener('drop',function(e){
  if(!drag||touchDrag)return;
  e.preventDefault();
  finishDrop();
});
M.addEventListener('dragend',function(){if(!touchDrag)endDrag();});

var lastPt=null, rafId=0;
function edgeLoop(){
  if(!touchDrag){rafId=0;return;}
  if(lastPt){
    var r=M.getBoundingClientRect(), dy=0;
    if(lastPt.y<r.top+48)dy=-9;else if(lastPt.y>r.bottom-48)dy=9;
    if(dy){
      var before=M.scrollTop;M.scrollTop+=dy;
      if(M.scrollTop!==before)updateDrop(dropTargetAt(document.elementFromPoint(lastPt.x,Math.min(Math.max(lastPt.y,r.top+2),r.bottom-2)),lastPt.y));
    }
  }
  rafId=requestAnimationFrame(edgeLoop);
}
function tMove(e){
  if(!touchDrag||!drag)return;
  if(e.cancelable)e.preventDefault();
  if(ghost)ghost.style.top=(e.clientY-ghostOff)+'px';
  lastPt={x:e.clientX,y:e.clientY};
  var r=M.getBoundingClientRect(), y=Math.min(Math.max(e.clientY,r.top+2),r.bottom-2);
  updateDrop(dropTargetAt(document.elementFromPoint(e.clientX,y),y));
}
function tEnd(e){
  window.removeEventListener('pointermove',tMove);
  window.removeEventListener('pointerup',tEnd);
  window.removeEventListener('pointercancel',tEnd);
  if(!touchDrag)return;
  touchDrag=false;lastPt=null;
  if(rafId){cancelAnimationFrame(rafId);rafId=0;}
  if(e.type==='pointerup')finishDrop();else endDrag();
}
M.addEventListener('pointerdown',function(e){
  if(e.pointerType==='mouse')return;
  var g=e.target.closest&&e.target.closest('.grip');
  if(!g)return;
  e.preventDefault();
  touchDrag=true;
  drag={id:g.dataset.id,kind:g.dataset.kind};
  var box=g.closest(drag.kind==='main'?'.grp':'.row'), r=box.getBoundingClientRect();
  ghost=box.cloneNode(true);
  ghost.classList.add('ghost');ghost.classList.remove('drop-before','drop-after','drop-into');
  ghost.style.left=r.left+'px';ghost.style.width=r.width+'px';ghost.style.top=r.top+'px';
  if(drag.kind==='main'&&r.height>120){ghost.style.height='60px';}
  ghostOff=e.clientY-r.top;
  document.body.appendChild(ghost);
  box.classList.add('dragging');
  if(navigator.vibrate)try{navigator.vibrate(15);}catch(x){}
  lastPt={x:e.clientX,y:e.clientY};
  window.addEventListener('pointermove',tMove,{passive:false});
  window.addEventListener('pointerup',tEnd);
  window.addEventListener('pointercancel',tEnd);
  if(!rafId)rafId=requestAnimationFrame(edgeLoop);
});

$('importFile').onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(o&&o.data&&typeof o.data==='object')o=o.data;
      if(!o||typeof o!=='object'||Array.isArray(o))throw 1;
      Object.keys(o).forEach(function(k){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(o[k]))throw 1;
        o[k].forEach(function(it){
          if(!it||typeof it.text!=='string')throw 1;
          if(!it.id)it.id=uid();
          if(it.type==='group'){
            if(!Array.isArray(it.children))it.children=[];
            it.children.forEach(function(c){if(!c.id)c.id=uid();c.done=!!c.done;});
          }else it.done=!!it.done;
        });
      });
      if(!confirm(tr('importQ'))) return;
      normalize(o);db=o;save();setDate(cur);
    }catch(e){alert(tr('importErr'));}
  };
  r.readAsText(f);
};

loadPrefs();
db=load();
placeComposer();
applyTheme();
applyLang();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
window.__todo={get db(){return db;}};
})();
</script>
